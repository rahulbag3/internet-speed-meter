<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internet Speed Meter</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #f1f2f3;
    display: grid;
    place-items: center;
    font-family: system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    background: #121212;
    border-radius: 28px;
    display: grid;
    box-shadow: 0 30px 60px rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.08);
    color: #fff;
  }
  body[data-v="side"] .card {
    grid-template-columns: 1fr 1fr;
    column-gap: 54px;
    width: min(92vw, 580px);
    padding: 42px 46px 34px;
  }
  body[data-v="stack"] .card {
    grid-template-columns: 1fr;
    width: min(92vw, 460px);
    padding: 30px 34px 26px;
  }

  .tools {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .layouts {
    display: flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px;
  }
  .lay {
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #8a8a8a;
    cursor: pointer;
    display: grid;
    place-items: center;
    padding: 0;
    transition: background .2s, color .2s;
  }
  .lay:hover { background: rgba(255,255,255,.08); color: #ddd; }
  .lay[aria-pressed="true"] { background: rgba(255,255,255,.14); color: #fff; }
  .retest {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.16);
    background: transparent;
    color: #bdbdbd;
    cursor: pointer;
    display: grid;
    place-items: center;
    padding: 0;
    transition: background .2s, color .2s, border-color .2s, transform .1s;
  }
  .retest:hover { background: rgba(255,255,255,.09); color: #fff; border-color: rgba(255,255,255,.28); }
  .retest:active { transform: scale(.94); }
  .retest:disabled { opacity: .55; cursor: default; }
  .retest svg { display: block; }
  .retest.spinning svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    order: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  body[data-v="side"] .footer { grid-column: 1 / -1; margin-top: 26px; }
  body[data-v="side"] .tools { margin-right: 12px; }
  body[data-v="stack"] .footer { margin-top: 16px; }
  body[data-v="side"] #t-dl { order: 1; }
  body[data-v="side"] #t-up { order: 2; }
  body[data-v="stack"] #t-up { order: 1; padding: 4px 0 16px; }
  body[data-v="stack"] #t-dl { order: 2; border-top: 1px solid #2b2b2b; padding: 16px 0 4px; }

  .name { display: inline-flex; align-items: center; gap: 10px; }
  .ic {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: grid;
    place-items: center;
  }
  .label {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #979797;
  }
  body[data-v="stack"] .label { font-size: 15px; color: #fff; }
  body[data-v="stack"] .ic { width: 40px; height: 40px; }
  body[data-v="stack"] .ic svg { width: 18px; height: 18px; }
  .big { display: flex; align-items: baseline; gap: 7px; }
  .big .num {
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
  }
  body[data-v="side"] .big .num { font-size: 88px; }
  body[data-v="stack"] .big .num { font-size: 28px; }
  body[data-v="stack"] .big .unit { font-size: 13px; }
  .big .unit { font-size: 15px; font-weight: 600; color: #8a8a8a; }
  body[data-v="side"] .thead { display: block; }
  body[data-v="side"] .big { margin-top: 10px; }
  body[data-v="stack"] .thead { display: flex; align-items: center; justify-content: space-between; gap: 16px; }

  .dots { display: grid; gap: 9px; }
  body[data-v="side"] .dots { grid-template-columns: repeat(12, 1fr); width: 100%; margin-top: 30px; }
  body[data-v="stack"] .dots { display: none; }
  .dots i {
    aspect-ratio: 1;
    border-radius: 3px;
    background: #3a3a3a;
    transition: background .25s;
  }
  .dots i.on { background: #e9ff45; }

  .status {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #8b8b8b;
    min-height: 12px;
  }
  .status.err { color: #ff8a70; }

  @media (max-width: 700px) {
    body[data-v="side"] .card { padding: 34px 30px 28px; column-gap: 34px; }
    body[data-v="side"] .big .num { font-size: 60px; }
    body[data-v="side"] .dots { margin-top: 22px; }
    body[data-v="stack"] .card { padding: 26px 24px 22px; }
  }
  @media (max-width: 460px) {
    body[data-v="side"] .card { grid-template-columns: 1fr; row-gap: 26px; padding: 34px 26px 26px; }
    body[data-v="side"] .big .num { font-size: 64px; }
  }
</style>
</head>
<body data-v="side">
  <main class="card">
    <section class="tracker" id="t-dl">
      <div class="thead">
        <span class="name">
          <span class="ic" style="background:#6fb3c7">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#161616"><path d="M12 20.8 5.8 14.6h3.9V5.4h4.6v9.2h3.9z"/></svg>
          </span>
          <span class="label">Download</span>
        </span>
        <span class="big"><span class="num" id="dl">—</span><span class="unit">Mbps</span></span>
      </div>
      <div class="dots" id="dots-dl" aria-hidden="true"></div>
    </section>

    <section class="tracker" id="t-up">
      <div class="thead">
        <span class="name">
          <span class="ic" style="background:#b8491c">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#161616"><path d="M12 3.2 18.2 9.4h-3.9v9.2H9.7V9.4H5.8z"/></svg>
          </span>
          <span class="label">Upload</span>
        </span>
        <span class="big"><span class="num" id="up">—</span><span class="unit">Mbps</span></span>
      </div>
      <div class="dots" id="dots-up" aria-hidden="true"></div>
    </section>

    <div class="footer">
      <div class="status" id="status">Press ↻ to test</div>
      <div class="tools">
        <div class="layouts" role="group" aria-label="Layout">
          <button class="lay" id="v-side" aria-label="Side-by-side layout" aria-pressed="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="7" height="16" rx="2"/><rect x="13" y="4" width="7" height="16" rx="2"/></svg>
          </button>
          <button class="lay" id="v-stack" aria-label="Stacked layout" aria-pressed="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/></svg>
          </button>
        </div>
        <button class="retest" id="retest" aria-label="Run speed test" title="Run speed test">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/>
          </svg>
        </button>
      </div>
    </div>
  </main>

<script>
(() => {
  const CF = 'https://speed.cloudflare.com/';
  const DL_BYTES = 200e6, DL_ROUND = 75e6, DL_MAX_MS = 15000;
  const UP_BYTES = 200e6, UP_ROUND = 25e6, UP_MAX_MS = 15000;
  const COUNTS = { side: 96, stack: 48 };

  const el = id => document.getElementById(id);
  const dlEl = el('dl'), upEl = el('up'), statusEl = el('status'),
        btn = el('retest'), btnSide = el('v-side'), btnStack = el('v-stack'),
        tDlEl = el('t-dl'), tUpEl = el('t-up'),
        card = document.querySelector('.card'), footer = document.querySelector('.footer');

  let variant = 'side';
  try { variant = localStorage.getItem('sm-variant') === 'stack' ? 'stack' : 'side'; } catch {}
  const qv = new URLSearchParams(location.search).get('v');
  if (qv === 'side' || qv === 'stack') variant = qv;
  let testing = false, lastDl = null, lastUp = null;
  let fracDl = null, fracUp = null;
  let dotsDl = null, dotsUp = null;

  const fmt = v => v >= 10 ? String(Math.round(v)) : v.toFixed(1);
  const setStatus = (t, err) => {
    statusEl.textContent = t;
    statusEl.classList.toggle('err', !!err);
  };

  function makeDots(container, count) {
    container.innerHTML = '';
    const els = [];
    for (let i = 0; i < count; i++) {
      const d = document.createElement('i');
      container.appendChild(d);
      els.push(d);
    }
    const cols = getComputedStyle(container).gridTemplateColumns.split(' ').length;
    const rows = Math.ceil(count / cols);
    const cap = Math.max(1, count - cols);
    return {
      setFrac(f) {
        const lit = f == null ? 0 : Math.max(0, Math.min(cap, Math.round(f * cap)));
        for (let p = 0; p < count; p++) {
          const idx = (rows - 1 - Math.floor(p / cols)) * cols + p % cols;
          if (idx < count) els[idx].classList.toggle('on', p < lit);
        }
      },
      setPattern(set) {
        for (let i = 0; i < count; i++) els[i].classList.toggle('on', set.has(i));
      }
    };
  }
  function buildDots() {
    dotsDl = makeDots(el('dots-dl'), COUNTS[variant]);
    dotsUp = makeDots(el('dots-up'), COUNTS[variant]);
    dotsDl.setFrac(fracDl);
    dotsUp.setFrac(fracUp);
  }
  function applyVariant(v) {
    variant = v;
    document.body.dataset.v = v;
    btnSide.setAttribute('aria-pressed', String(v === 'side'));
    btnStack.setAttribute('aria-pressed', String(v === 'stack'));
    try { localStorage.setItem('sm-variant', v); } catch {}
  }
  const DUR = 450, EASE = 'cubic-bezier(.22,1,.36,1)';
  let animating = false;
  function setVariant(v, animate) {
    if (v === variant || animating) return;
    if (!animate || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      applyVariant(v);
      buildDots();
      return;
    }
    animating = true;
    const moving = [tDlEl, tUpEl, footer];
    const firstCard = card.getBoundingClientRect();
    const firstRects = moving.map(e => e.getBoundingClientRect());
    applyVariant(v);
    buildDots();
    const lastCard = card.getBoundingClientRect();
    card.style.transition = 'none';
    card.style.width = firstCard.width + 'px';
    card.style.height = firstCard.height + 'px';
    const pinned = card.getBoundingClientRect();
    card.style.transform = `translate(${firstCard.left - pinned.left}px, ${firstCard.top - pinned.top}px)`;
    moving.forEach((e, i) => {
      e.style.transition = 'none';
      const cur = e.getBoundingClientRect();
      const sx = firstRects[i].width / cur.width, sy = firstRects[i].height / cur.height;
      e.style.transformOrigin = 'top left';
      e.style.transform = `translate(${firstRects[i].left - cur.left}px, ${firstRects[i].top - cur.top}px) scale(${sx}, ${sy})`;
    });
    card.getBoundingClientRect();
    const tr = `transform ${DUR}ms ${EASE}`;
    card.style.transition = `${tr}, width ${DUR}ms ${EASE}, height ${DUR}ms ${EASE}`;
    card.style.transform = 'translate(0,0)';
    card.style.width = lastCard.width + 'px';
    card.style.height = lastCard.height + 'px';
    moving.forEach(e => { e.style.transition = tr; e.style.transform = ''; });
    setTimeout(() => {
      card.style.transition = card.style.transform = card.style.width = card.style.height = '';
      moving.forEach(e => { e.style.transition = ''; e.style.transformOrigin = ''; });
      animating = false;
    }, DUR + 30);
  }

  const clearAll = () => {
    lastDl = lastUp = null;
    fracDl = fracUp = null;
    dlEl.textContent = upEl.textContent = '—';
    dotsDl.setFrac(null);
    dotsUp.setFrac(null);
  };

  async function measureDownload(onSample) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), DL_MAX_MS);
    const t0 = performance.now();
    let bytes = 0, lastT = t0, lastB = 0;
    const samples = [];
    const record = now => {
      const mbps = (bytes - lastB) * 8 / ((now - lastT) / 1000) / 1e6;
      samples.push({ t: now - t0, mbps });
      onSample(mbps);
      lastT = now; lastB = bytes;
    };
    try {
      while (bytes < DL_BYTES) {
        const want = Math.min(DL_ROUND, DL_BYTES - bytes);
        const res = await fetch(CF + '__down?bytes=' + want + '&' + Math.random(),
          { cache: 'no-store', signal: ctrl.signal });
        if (res.body) {
          const reader = res.body.getReader();
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            bytes += value.length;
            const now = performance.now();
            if (now - lastT >= 120) record(now);
          }
        } else {
          bytes += (await res.arrayBuffer()).byteLength;
        }
      }
    } catch (e) {
      if (bytes === 0) throw e;
    } finally {
      clearTimeout(timer);
    }
    const elapsed = (performance.now() - t0) / 1000;
    const steady = samples.filter(s => s.t > 1200);
    const pool = steady.length >= 3 ? steady : samples;
    return pool.length
      ? pool.reduce((a, s) => a + s.mbps, 0) / pool.length
      : bytes * 8 / elapsed / 1e6;
  }

  async function measureUpload(onSample) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), UP_MAX_MS);
    const t0 = performance.now();
    let bytes = 0, lastT = t0, lastB = 0;
    const samples = [];
    try {
      while (bytes < UP_BYTES) {
        const want = Math.min(UP_ROUND, UP_BYTES - bytes);
        await fetch(CF + '__up', {
          method: 'POST', body: new Blob([new Uint8Array(want)]),
          cache: 'no-store', signal: ctrl.signal,
          headers: { 'Content-Type': 'text/plain' }
        });
        bytes += want;
        const now = performance.now();
        const mbps = (bytes - lastB) * 8 / ((now - lastT) / 1000) / 1e6;
        samples.push({ t: now - t0, mbps });
        onSample(mbps);
        lastT = now; lastB = bytes;
      }
    } catch (e) {
      if (bytes === 0) throw e;
    } finally {
      clearTimeout(timer);
    }
    const elapsed = (performance.now() - t0) / 1000;
    const steady = samples.filter(s => s.t > 1200);
    const pool = steady.length >= 3 ? steady : samples;
    return pool.length
      ? pool.reduce((a, s) => a + s.mbps, 0) / pool.length
      : bytes * 8 / elapsed / 1e6;
  }

  const DINO_BODY = [[2,2],[2,3],[2,4],[3,2],[3,3],[3,4],[3,5],[4,2],[4,3],[5,1],[5,2],[5,3],[5,4]];
  const LEGS_A = [[6,2],[6,4]];
  const LEGS_B = [[6,3]];
  const CACTUS = [[4,1],[5,0],[5,1],[5,2],[6,1]];
  let dinoTimer = null, dinoTick = 0, cactusX = 11, activeGrid = null;

  function scenePattern(shift, jump, legs, cactus) {
    const lit = new Set();
    const add = (r, c) => { if (r >= 0 && r < 8 && c >= 0 && c < 12) lit.add(r * 12 + c); };
    for (let c = 0; c < 12; c++) add(7, c);
    const off = jump ? -2 : 0;
    for (const [r, c] of DINO_BODY) add(r + off, c + shift);
    if (!jump) for (const [r, c] of (legs ? LEGS_B : LEGS_A)) add(r, c + shift);
    if (cactus != null) for (const [r, c] of CACTUS) add(r, c + cactus);
    return lit;
  }
  function dinoFrame() {
    dinoTick++;
    if (dinoTick % 2 === 0) {
      cactusX--;
      if (cactusX < -2) cactusX = 11;
    }
    const jumping = cactusX >= 2 && cactusX <= 6;
    (activeGrid === 'dl' ? dotsDl : dotsUp).setPattern(scenePattern(0, jumping, dinoTick % 4 < 2 ? 0 : 1, cactusX));
  }
  function startRun(grid) {
    stopRun();
    activeGrid = grid;
    dinoTick = 0;
    cactusX = 11;
    dinoFrame();
    dinoTimer = setInterval(dinoFrame, 110);
  }
  function stopRun() {
    if (dinoTimer) { clearInterval(dinoTimer); dinoTimer = null; }
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function crossToUpload() {
    for (const s of [6, 8, 10]) {
      dotsDl.setPattern(scenePattern(s, false, 0, null));
      await sleep(110);
    }
    dotsDl.setFrac(fracDl);
    dotsUp.setPattern(new Set());
    await sleep(110);
    for (const s of [-2, -1, 0]) {
      dotsUp.setPattern(scenePattern(s, false, s < 0 ? 1 : 0, null));
      await sleep(110);
    }
  }

  async function runTest() {
    if (testing) return;
    testing = true;
    btn.disabled = true;
    btn.classList.add('spinning');
    clearAll();
    try {
      setStatus('Measuring download…');
      startRun('dl');
      const dl = await measureDownload(mbps => {
        lastDl = mbps;
        dlEl.textContent = fmt(mbps);
      });
      stopRun();
      lastDl = dl;
      dlEl.textContent = fmt(dl);
      const refDl = Math.max(dl, lastUp || 0);
      fracDl = refDl > 0 ? dl / refDl : 0;
      dotsDl.setFrac(fracDl);

      await crossToUpload();

      setStatus('Measuring upload…');
      startRun('up');
      const up = await measureUpload(mbps => {
        lastUp = mbps;
        upEl.textContent = fmt(mbps);
      });
      stopRun();
      lastUp = up;
      upEl.textContent = fmt(up);
      const ref = Math.max(dl, up) || 1;
      fracDl = dl / ref;
      fracUp = up / ref;
      dotsDl.setFrac(fracDl);
      dotsUp.setFrac(fracUp);

      setStatus('Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    } catch {
      clearAll();
      setStatus('Connection error — press ↻ to retry', true);
    } finally {
      stopRun();
      testing = false;
      btn.disabled = false;
      btn.classList.remove('spinning');
    }
  }

  btn.addEventListener('click', runTest);
  btnSide.addEventListener('click', () => setVariant('side', true));
  btnStack.addEventListener('click', () => setVariant('stack', true));
  window.addEventListener('resize', buildDots);
  applyVariant(variant);
  buildDots();
})();
</script>
</body>
</html>
